steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/jcevolution-app:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/jcevolution-app:latest', '.']

  # 2. Push image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/jcevolution-app:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'jc-evolution-engenharia-mecanica-art-git'
      - '--image'
      - 'gcr.io/$PROJECT_ID/jcevolution-app:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/jcevolution-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/jcevolution-app:latest'
